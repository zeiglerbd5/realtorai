    "realtorai.integrations.docusign.rooms",
    "realtorai.integrations.fema_flood",
    "realtorai.integrations.graph.auth",
    "realtorai.integrations.graph.email",
    "realtorai.integrations.maine_parcels",
    "realtorai.integrations.matterport.auth",
    "realtorai.integrations.matterport.client",
    "realtorai.integrations.matterport.downloader",
    "realtorai.integrations.matterport.models",
    "realtorai.integrations.registry.browntech_alis",
    "realtorai.integrations.spark.buyer_alerts",
    "realtorai.integrations.spark.client",
    "realtorai.integrations.spark.listings",
    "realtorai.integrations.spark.mls_feeder",
    "realtorai.integrations.spark.mock",
    "realtorai.integrations.spark.submission",
    "realtorai.orchestration.approval",
    "realtorai.orchestration.copilot",
    "realtorai.orchestration.dispatcher",
    "realtorai.orchestration.feedback",
    "realtorai.orchestration.queue",
    "realtorai.rag.config",
    "realtorai.rag.ingestion",
    "realtorai.rag.retrieval",
    "realtorai.rag.store",
    "realtorai.storage.client_files",
    "realtorai.storage.database",
    "realtorai.storage.keychain",
    "realtorai.transactions.tracker",
    "realtorai.ui.app",
    "realtorai.ui.routes.chat",
    "realtorai.ui.routes.clients",
    "realtorai.ui.routes.pending",
    "realtorai.ui.routes.transactions",
    "realtorai.workflows.buyer",
    "realtorai.workflows.closing",
    "realtorai.workflows.common",
    "realtorai.workflows.email_trigger",
    "realtorai.workflows.engine",
    "realtorai.workflows.enrichment",
    "realtorai.workflows.listing",
