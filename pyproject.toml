[project]
name = "realtorai"
version = "0.1.0"
description = "Local-first AI copilot for real estate professionals"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "All Rights Reserved" }
authors = [{ name = "Brett Zeigler" }]

dependencies = [
    # Claude API — chat copilot, classification, extraction, verification
    "anthropic>=0.116.0",
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.12",
    # Data validation & settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Database
    "aiosqlite>=0.20.0",
    # Microsoft Graph API
    "msal>=1.31.0",
    "httpx>=0.27.0",
    # macOS Keychain
    "keyring>=25.4.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.9.0",  # Nice CLI output
    "structlog>=24.4.0",  # Structured logging
    # Map rendering (flood-map composites, tax-map parcel plots)
    "pillow>=10.0.0",
    # RAG (Retrieval-Augmented Generation)
    "chromadb>=0.5.0",
    "pypdf>=4.0.0",
    "sentence-transformers>=3.0.0",
    "markdown>=3.10.2",
    "duckduckgo-search>=8.1.1",
]

[project.optional-dependencies]
# Optional on-device fallback model (Apple Silicon only)
local = [
    "mlx>=0.21.0",
    "mlx-lm>=0.19.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
realtorai = "realtorai.cli:main"
realtorai-daemon = "realtorai.daemon:main"
realtorai-web = "realtorai.cli:web_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/realtorai"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# UP042 wants StrEnum; the (str, Enum) idiom is kept deliberately for
# painless JSON/DB serialization across the schema modules.
ignore = ["UP042"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
