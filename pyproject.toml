[project]
name = "realtorai"
version = "0.1.0"
description = "Local-first AI copilot for real estate professionals"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "All Rights Reserved" }
authors = [{ name = "Brett Zeigler" }]

dependencies = [
    # Claude API — chat copilot, classification, extraction, verification
    "anthropic>=0.116.0",
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.12",
    # Data validation & settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Database
    "aiosqlite>=0.20.0",
    # Microsoft Graph API
    "msal>=1.31.0",
    "httpx>=0.27.0",
    # macOS Keychain
    "keyring>=25.4.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.9.0",  # Nice CLI output
    "structlog>=24.4.0",  # Structured logging
    # Map rendering (flood-map composites, tax-map parcel plots)
    "pillow>=10.0.0",
    # RAG (Retrieval-Augmented Generation)
    "chromadb>=0.5.0",
    "pypdf>=4.0.0",
    "sentence-transformers>=3.0.0",
    "markdown>=3.10.2",
    "duckduckgo-search>=8.1.1",
]

[project.optional-dependencies]
# Optional on-device fallback model (Apple Silicon only)
local = [
    "mlx>=0.21.0",
    "mlx-lm>=0.19.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-socket>=0.7.0",  # CI asserts the suite is hermetic
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12",
    "types-Markdown>=3.9.0",
]

[project.scripts]
realtorai = "realtorai.cli:main"
realtorai-daemon = "realtorai.daemon:main"
realtorai-web = "realtorai.cli:web_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/realtorai"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# UP042 wants StrEnum; the (str, Enum) idiom is kept deliberately for
# painless JSON/DB serialization across the schema modules.
ignore = ["UP042"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "template: needs a fillable PDF under data/templates/ (gitignored — always skips in CI; set REALTORAI_REQUIRE_TEMPLATES=1 locally to make the skip a failure)",
]
# Safe today (verified: the suite passes under -W error::DeprecationWarning) and
# only stays safe because constraints.txt pins the toolchain.
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["realtorai"]
branch = true
omit = [
    "*/realtorai/daemon.py",   # long-running poll loop, exercised by hand
    "*/realtorai/cli.py",      # argparse entry points
    "*/realtorai/ui/app.py",   # server wiring
]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]

[tool.mypy]
# 3.12, not the 3.11 floor in requires-python. numpy arrives transitively via
# chromadb and ships stubs using PEP 695 `type` statements; mypy targeting 3.11
# cannot parse them, and it is a fatal parse error rather than a suppressible
# one (follow_imports/ignore_errors do not reach it). 3.11 support is still
# enforced — the CI test matrix runs it, and ruff targets py311 — so what this
# gives up is version-conditional stdlib stub selection, not real coverage.
python_version = "3.12"
strict = true

# Untyped third parties. `msal` publishes no stubs; the rest are C-extension or
# dynamically-typed packages. PyYAML and Markdown are deliberately absent —
# real stub packages exist for those and are installed via the dev extra.
[[tool.mypy.overrides]]
module = ["msal.*", "chromadb.*", "sentence_transformers.*", "duckduckgo_search.*", "keyring.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Type-debt burn-down.
#
# `strict = true` reports ~300 errors across these 55 modules, while the other
# 50 modules in the package are already clean. Rather than run mypy
# non-blocking (which nobody reads) or freeze a line-numbered baseline file
# (which rots on the first reformat), the debt is an explicit opt-OUT list:
# CI gates on mypy today, and anything not named here — including everything
# added from now on — is strict from birth.
#
# The length of this list is the debt counter. Fixing a module means deleting
# its line, which shows up in review as a real diff. Do not add to it.
# ---------------------------------------------------------------------------
[[tool.mypy.overrides]]
ignore_errors = true
module = [
    "realtorai.agents.email_agent",
    "realtorai.cli",
    "realtorai.daemon",
    "realtorai.documents.mis_filler",
    "realtorai.documents.pdf_fill",
    "realtorai.documents.templates",
    "realtorai.documents.tw_filler",
    "realtorai.inference.claude_engine",
    "realtorai.inference.engine",
