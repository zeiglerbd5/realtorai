name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]" -c constraints.txt
      - run: ruff check .

  types:
    name: types (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]" -c constraints.txt
      # Passes because 55 modules sit on the ignore_errors debt list in
      # pyproject.toml. That list is the type-debt counter — it shrinks, never grows.
      - run: mypy src/realtorai

  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is declared supported in requires-python but had never been tested.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]" -c constraints.txt

      # --allow-unix-socket is mandatory, not cosmetic: asyncio's event-loop
      # self-pipe uses socket.socketpair(), and blocking it fails 54 tests.
      - name: Test (offline — mock backends, no keys, no network)
        env:
          DATA_DIR: ${{ runner.temp }}/realtorai-data
        run: >-
          pytest -q
          --disable-socket --allow-unix-socket
          --cov=realtorai --cov-report=term-missing --cov-report=xml

      # data/templates/ is gitignored, so these can never run here. Report them
      # rather than let a permanently-skipped test look like a passing one.
      - name: Report template-gated tests
        if: always()
        run: pytest --collect-only -q -m template || true

      - uses: actions/upload-artifact@v4
        if: always() && matrix.python == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  evals-offline:
    name: evals (offline, deterministic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]" -c constraints.txt

      - name: Schema coverage — every record field can reach a form
        run: >-
          python -m realtorai.evals schema-coverage
          --json evals-out/schema-coverage.json --github-summary

      - name: docs/field-utilization.md is current
        run: python scripts/field_utilization.py --check

      # The heuristic classifier is the production path whenever the API is
      # unavailable, so this is a real regression test, not a stand-in. Being
      # deterministic, it gates on an exact snapshot diff rather than a float.
      - name: Intake classifier (offline heuristic backend)
        env:
          DATA_DIR: ${{ runner.temp }}/realtorai-data
        run: >-
          python -m realtorai.evals intake
          --backend heuristic
          --snapshot src/realtorai/evals/snapshots/intake-heuristic.json
          --json evals-out/intake-heuristic.json
          --min-cases 20
          --github-summary

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports-offline
          path: evals-out/
